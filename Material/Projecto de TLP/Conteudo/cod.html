<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contacto - Efeito 3D Lateral</title>
<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    height: 100vh;
    background: linear-gradient(135deg, #0a1b2a, #173b5a);
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: "Poppins", sans-serif;
    overflow: hidden;
  }

  .carousel {
    position: relative;
    width: 400px;
    height: 500px;
    perspective: 1200px;
  }

  .card {
    position: absolute;
    width: 100%;
    height: 100%;
    border-radius: 20px;
    color: #fff;
    padding: 20px;
    transition: transform 1s ease, opacity 1s ease, z-index 1s ease;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 22px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
  }

  .card:nth-child(1) { background: #e74c3c; }
  .card:nth-child(2) { background: #3498db; }
  .card:nth-child(3) { background: #27ae60; }
  .card:nth-child(4) { background: #f39c12; }
  .card:nth-child(5) { background: #9b59b6; }
  .card:nth-child(6) { background: #16a085; }

  .nav-btn {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    background: rgba(255, 255, 255, 0.15);
    color: #fff;
    border: none;
    font-size: 40px;
    border-radius: 50%;
    cursor: pointer;
    padding: 10px;
    transition: background 0.3s;
    z-index: 10;
  }

  .nav-btn:hover {
    background: rgba(255,255,255,0.3);
  }

  .left-btn {
    left: -80px;
  }

  .right-btn {
    right: -80px;
  }
</style>
</head>
<body>

<div class="carousel">
  <button class="nav-btn left-btn" onclick="moveLeft()">&#10094;</button>
  
  <div class="card">Contacto 1</div>
  <div class="card">Contacto 2</div>
  <div class="card">Contacto 3</div>
  <div class="card">Contacto 4</div>
  <div class="card">Contacto 5</div>
  <div class="card">Contacto 6</div>
  
  <button class="nav-btn right-btn" onclick="moveRight()">&#10095;</button>
</div>

<script>
const cards = document.querySelectorAll(".card");
let current = 0;

function updateCards() {
  cards.forEach((card, i) => {
    const pos = (i - current + cards.length) % cards.length;
    
    switch(pos) {
      case 0: // Centro
        card.style.zIndex = 6;
        card.style.transform = "translateX(0px) scale(1) rotateY(0deg)";
        card.style.opacity = "1";
        break;

      case 1: // Direita próxima
        card.style.zIndex = 5;
        card.style.transform = "translateX(200px) scale(0.9) rotateY(-20deg)";
        card.style.opacity = "0.8";
        break;

      case 2: // Direita distante
        card.style.zIndex = 4;
        card.style.transform = "translateX(350px) scale(0.75) rotateY(-30deg)";
        card.style.opacity = "0.5";
        break;

      case 3: // Fundo (invisível, atrás de tudo)
        card.style.zIndex = 1;
        card.style.transform = "translateX(0px) scale(0.6) rotateY(180deg)";
        card.style.opacity = "0";
        break;

      case 4: // Esquerda distante
        card.style.zIndex = 3;
        card.style.transform = "translateX(-350px) scale(0.75) rotateY(30deg)";
        card.style.opacity = "0.5";
        break;

      case 5: // Esquerda próxima
        card.style.zIndex = 4;
        card.style.transform = "translateX(-200px) scale(0.9) rotateY(20deg)";
        card.style.opacity = "0.8";
        break;
    }
  });
}

function moveRight() {
  current = (current + 1) % cards.length;
  updateCards();
}

function moveLeft() {
  current = (current - 1 + cards.length) % cards.length;
  updateCards();
}

updateCards();
</script>

</body>
</html>
