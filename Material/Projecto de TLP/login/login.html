<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Workshop Futurist</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
</head>
<body>
  <div class="container">
    <!-- LOGIN -->
    <div class="form-box login">
      <form id="loginForm">
        <h1>Entrar</h1>
        <div class="input-box">
          <input type="text" id="loginUser" placeholder="Nome do Usuário" required>
          <i class='bx bxs-user'></i>
        </div>
        <div class="input-box">
          <input type="password" id="loginPass" placeholder="Senha" required>
          <i class='bx bxs-lock-alt'></i>
        </div>
        <div class="forgot-link">
          <a href="#">Esqueceu a senha?</a>
        </div>
        <button type="submit" class="btn">Entrar</button>
      </form>
    </div>

    <!-- REGISTRO -->
    <div class="form-box register">
      <form id="registerForm">
        <h1>Registro</h1>
        <div class="input-box">
          <input type="text" id="regUser" placeholder="Nome do Usuário" required>
          <i class='bx bxs-user'></i>
        </div>
        <div class="input-box">
          <input type="email" id="regEmail" placeholder="Email" required>
          <i class='bx bxs-envelope'></i>
        </div>
        <div class="input-box">
          <input type="password" id="regPass" placeholder="Senha" required>
          <i class='bx bxs-lock-alt'></i>
        </div>
        <button type="submit" class="btn">Registrar</button>
      </form>
    </div>

    <!-- TOGGLE PANEL -->
    <div class="toggle-box">
      <div class="toggle-panel toggle-left">
        <h1>Olá, Bem-vindo!</h1>
        <p>Não tens uma conta?</p>
        <button class="btn register-btn">Registro</button>
      </div>
      <div class="toggle-panel toggle-right">
        <h1>Bem-vindo de volta!</h1>
        <p>Já tens uma conta?</p>
        <button class="btn login-btn">Entrar</button>
      </div>
    </div>
  </div>

  <script src="login.js"></script>
</body>
</html>
